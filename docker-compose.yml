services:
  #  PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tfg-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-tfg_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tfg_password}
      POSTGRES_DB: ${DB_NAME:-tfg_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tfg_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tfg-network

  #  FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tfg-backend
    env_file:
      - .env
    environment:
      # 🗄️ Database Configuration
      DATABASE_URL: postgresql://${DB_USER:-tfg_user}:${DB_PASSWORD:-tfg_password}@db:5432/${DB_NAME:-tfg_db}
      
      # 🔐 Security Configuration
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # 📂 Storage Configuration
      STORAGE_PATH: storage
      MODEL_STORAGE_PATH: storage/models
      
      # 📱 Application Configuration
      APP_NAME: TFG API
      APP_VERSION: 1.0.0
      DEBUG: ${DEBUG:-false}

      # 📧 Email / SMTP Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-False}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://91.9.101.47:81}
    volumes:
      - ./storage:/app/storage
      - ./app:/app/app
      - ./main.py:/app/main.py
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tfg-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  #  Nginx reverse proxy + static frontend
  nginx:
    image: nginx:1.27-alpine
    container_name: tfg-nginx
    ports:
      - "81:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tfg-network

  # 🎨 React Frontend (opcional)
  # frontend:
  #   build:
  #     context: ../companion-ui
  #     dockerfile: Dockerfile
  #   container_name: tfg-frontend
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_URL: http://backend:8000
  #   depends_on:
  #     - backend
  #   networks:
  #     - tfg-network

networks:
  tfg-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
